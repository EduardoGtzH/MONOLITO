events {}

http {
    # An "upstream" is nginx's name for a pool of backends behind one
    # logical name. With no load balancing directive specified, nginx
    # defaults to round-robin — the same policy the Go load balancer
    # implements by hand with atomic.AddUint64.
    #
    # One pool per service, exactly like the per-service counters in the
    # Go balancer's sync.Map. The pools are independent: traffic to
    # alumnos does not move the cursor of materias.
    #
    # max_fails / fail_timeout are nginx open-source's health checking:
    # it is PASSIVE, unlike the middleware's ticker that polls /heartbeat
    # every 5s. nginx does not probe backends on its own. It watches real
    # requests, and after `max_fails` failures within `fail_timeout` it
    # stops routing to that backend for `fail_timeout`, then retries it.
    # Active health checks are an nginx-plus feature.

    upstream alumnos_pool {
        server alumnos-1:8080 max_fails=3 fail_timeout=30s;
        server alumnos-2:8080 max_fails=3 fail_timeout=30s;
        server alumnos-3:8080 max_fails=3 fail_timeout=30s;

        # Alternative policies, to compare distribution via X-Instance-Id:
        #   least_conn;   # fewest open connections wins
        #   ip_hash;      # same client IP always lands on the same backend
    }

    upstream materias_pool {
        server materias-1:8080 max_fails=3 fail_timeout=30s;
        server materias-2:8080 max_fails=3 fail_timeout=30s;
        server materias-3:8080 max_fails=3 fail_timeout=30s;
    }

    upstream inscripciones_pool {
        server inscripciones-1:8080 max_fails=3 fail_timeout=30s;
        server inscripciones-2:8080 max_fails=3 fail_timeout=30s;
        server inscripciones-3:8080 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 8000;

        # CORS lives at the server level so every location inherits it.
        # Expose-Headers is what lets the browser's JavaScript READ
        # X-Instance-Id; without it the header arrives but stays hidden
        # and the frontend's instance log comes back empty.
        #
        # `always` makes nginx add these even on 4xx/5xx responses, so a
        # rejected enrollment still reaches the browser instead of being
        # swallowed as a CORS error.
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        add_header Access-Control-Expose-Headers
                   "X-Instance-Id, X-Backend-Target, X-Backend-Service" always;

        # The browser sends a preflight OPTIONS before any POST or DELETE.
        # It is answered here and never forwarded to a backend.
        if ($request_method = OPTIONS) {
            return 204;
        }

        # proxy_set_header does what httputil.ReverseProxy did automatically
        # in Go, spelled out explicitly: forward who really made the request
        # so the backend sees the client, not just "nginx".
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /alumnos {
            proxy_pass http://alumnos_pool;
        }

        # /materias and /grupos both belong to the same service, so both
        # point at the same pool — the equivalent of the two prefixes
        # listed under "materias" in routes.json.
        location /materias {
            proxy_pass http://materias_pool;
        }

        location /grupos {
            proxy_pass http://materias_pool;
        }

        location /inscripciones {
            proxy_pass http://inscripciones_pool;
        }

        # default_type instead of add_header: an add_header here would
        # override the server-level block and strip the CORS headers from
        # this location.
        location /heartbeat {
            default_type text/plain;
            return 200 "nginx gateway alive";
        }
    }
}
