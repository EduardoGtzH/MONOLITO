# Las claves que empiezan con x- son campos de extension: Compose las ignora
# al levantar servicios, y sirven para declarar bloques reutilizables.
x-env-comun: &env-comun
  DB_HOST: ${POSTGRES_HOST}
  DB_PORT: ${POSTGRES_PORT}
  DB_USER: ${POSTGRES_USER}
  DB_PASSWORD: ${POSTGRES_PASSWORD}
  CONSUL_HTTP_ADDR: http://consul:8500
  KAFKA_BROKER: kafka:9092

# Reglas de la cadena de validaciones de inscripciones. Cambiarlas y
# recrear (docker compose up -d inscripciones-1 inscripciones-2 inscripciones-3)
# basta para probarlas: no hay que recompilar.
x-reglas-inscripcion: &reglas-inscripcion
  MAX_CREDITOS: "30"
  # Periodo de inscripcion. Vacio = siempre abierto. Formato AAAA-MM-DD o
  # "AAAA-MM-DD HH:MM", en hora UTC (la del contenedor). Para ver el rechazo,
  # pon una fecha ya pasada en INSCRIPCION_FIN.
  INSCRIPCION_INICIO: ""
  INSCRIPCION_FIN: ""

x-servicio-base: &servicio-base
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    consul:
      condition: service_started
    kafka-init:
      condition: service_completed_successfully
  networks:
    - red_inscripciones

services:

  # ---------------------------------------------------------------- CONSUL
  # Modo dev: un solo nodo, en memoria, sin ACLs y sin persistencia.
  # Sirve para aprender la API y ver el discovery en vivo; en produccion
  # serian 3 o 5 nodos con almacenamiento persistente.
  consul:
    image: hashicorp/consul:latest
    container_name: consul
    restart: unless-stopped
    command: "agent -dev -client=0.0.0.0 -ui"
    ports:
      - "8500:8500"   # API HTTP + interfaz web en /ui
    networks:
      - red_inscripciones

  # ---------------------------------------------------------------- BASE DE DATOS
  db:
    image: postgres:16-alpine
    container_name: inscripciones_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro,z
    ports:
      - "5432:5432"
    networks:
      - red_inscripciones
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------- ALUMNOS
  alumnos-1:
    <<: *servicio-base
    build: ./services/alumnos
    image: inscripciones/alumnos:latest
    container_name: alumnos-1
    environment:
      <<: *env-comun
      INSTANCE_ID: alumnos-1
      DB_NAME: alumnos_db
    ports:
      - "8081:8080"

  alumnos-2:
    <<: *servicio-base
    build: ./services/alumnos
    image: inscripciones/alumnos:latest
    container_name: alumnos-2
    environment:
      <<: *env-comun
      INSTANCE_ID: alumnos-2
      DB_NAME: alumnos_db
    ports:
      - "8082:8080"

  alumnos-3:
    <<: *servicio-base
    build: ./services/alumnos
    image: inscripciones/alumnos:latest
    container_name: alumnos-3
    environment:
      <<: *env-comun
      INSTANCE_ID: alumnos-3
      DB_NAME: alumnos_db
    ports:
      - "8083:8080"

  # ---------------------------------------------------------------- MATERIAS
  materias-1:
    <<: *servicio-base
    build: ./services/materias
    image: inscripciones/materias:latest
    container_name: materias-1
    environment:
      <<: *env-comun
      INSTANCE_ID: materias-1
      DB_NAME: materias_db
    ports:
      - "8091:8080"

  materias-2:
    <<: *servicio-base
    build: ./services/materias
    image: inscripciones/materias:latest
    container_name: materias-2
    environment:
      <<: *env-comun
      INSTANCE_ID: materias-2
      DB_NAME: materias_db
    ports:
      - "8092:8080"

  materias-3:
    <<: *servicio-base
    build: ./services/materias
    image: inscripciones/materias:latest
    container_name: materias-3
    environment:
      <<: *env-comun
      INSTANCE_ID: materias-3
      DB_NAME: materias_db
    ports:
      - "8093:8080"

  # ---------------------------------------------------------------- INSCRIPCIONES
  inscripciones-1:
    <<: *servicio-base
    build: ./services/inscripciones
    image: inscripciones/inscripciones:latest
    container_name: inscripciones-1
    environment:
      <<: [*env-comun, *reglas-inscripcion]
      INSTANCE_ID: inscripciones-1
      DB_NAME: inscripciones_db
      ALUMNOS_URL: http://nginx-gateway:8000
      MATERIAS_URL: http://nginx-gateway:8000
    ports:
      - "8101:8080"

  inscripciones-2:
    <<: *servicio-base
    build: ./services/inscripciones
    image: inscripciones/inscripciones:latest
    container_name: inscripciones-2
    environment:
      <<: [*env-comun, *reglas-inscripcion]
      INSTANCE_ID: inscripciones-2
      DB_NAME: inscripciones_db
      ALUMNOS_URL: http://nginx-gateway:8000
      MATERIAS_URL: http://nginx-gateway:8000
    ports:
      - "8102:8080"

  inscripciones-3:
    <<: *servicio-base
    build: ./services/inscripciones
    image: inscripciones/inscripciones:latest
    container_name: inscripciones-3
    environment:
      <<: [*env-comun, *reglas-inscripcion]
      INSTANCE_ID: inscripciones-3
      DB_NAME: inscripciones_db
      ALUMNOS_URL: http://nginx-gateway:8000
      MATERIAS_URL: http://nginx-gateway:8000
    ports:
      - "8103:8080"

  # ---------------------------------------------------------------- NOTIFICACIONES
  # Consume los avisos de Kafka, los guarda en notificaciones_db y los sirve
  # en GET /notificaciones (por nginx) para que el frontend los muestre. Dos
  # instancias en el mismo consumer group se reparten las particiones.
  notificaciones-1:
    <<: *servicio-base
    build: ./services/notificaciones
    image: inscripciones/notificaciones:latest
    container_name: notificaciones-1
    environment:
      <<: *env-comun
      INSTANCE_ID: notificaciones-1
      DB_NAME: notificaciones_db

  notificaciones-2:
    <<: *servicio-base
    build: ./services/notificaciones
    image: inscripciones/notificaciones:latest
    container_name: notificaciones-2
    environment:
      <<: *env-comun
      INSTANCE_ID: notificaciones-2
      DB_NAME: notificaciones_db

  # ---------------------------------------------------------------- MIDDLEWARE
  middleware:
    build: ./middleware
    container_name: middleware
    restart: unless-stopped
    environment:
      PUERTO: "8500"
      ROUTES_FILE: /app/routes.json
    volumes:
      - ./middleware/routes.json:/app/routes.json:ro,z
    ports:
      - "8600:8500"
    networks:
      - red_inscripciones

  # ---------------------------------------------------------------- LOAD BALANCER
  loadbalancer:
    build: ./loadbalancer
    container_name: loadbalancer
    restart: unless-stopped
    environment:
      MIDDLEWARE_URL: http://middleware:8500
      PUERTO: "8000"
    ports:
      - "8001:8000"
    depends_on:
      - middleware
    networks:
      - red_inscripciones

  # ---------------------------------------------------------------- NGINX GATEWAY
  nginx-gateway:
    build: ./nginx-gateway
    container_name: nginx-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    # nginx resuelve los nombres de los upstream AL ARRANCAR. Si una
    # instancia no existe todavia, falla con "host not found in upstream".
    depends_on:
      - alumnos-1
      - alumnos-2
      - alumnos-3
      - materias-1
      - materias-2
      - materias-3
      - inscripciones-1
      - inscripciones-2
      - inscripciones-3
      - notificaciones-1
      - notificaciones-2
    networks:
      - red_inscripciones

  # ---------------------------------------------------------------- FRONTEND
  frontend:
    build:
      context: ./frontend
      args:
        # localhost porque quien hace las peticiones es el navegador del
        # usuario, no este contenedor.
        VITE_API_URL: http://localhost:8000
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - loadbalancer
    networks:
      - red_inscripciones

  # ---------------------------------------------------------------- KAFKA
  # Un solo broker en modo KRaft: hace de broker y de controlador a la vez,
  # sin ZooKeeper. Es la configuracion de kafka_example de la clase, salvo el
  # listener anunciado: aqui los clientes son otros contenedores, asi que
  # Kafka se anuncia como kafka:9092 en lugar de localhost:9092.
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Los topicos se crean a proposito en kafka-init, con 3 particiones.
      # Sin esto, un consumidor que preguntara por un topico que todavia no
      # existe lo crearia solo, y con una sola particion.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Tope de memoria para la JVM, para que quepa en una maquina virtual.
      KAFKA_HEAP_OPTS: "-Xmx512m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s
    networks:
      - red_inscripciones

  # Contenedor de un solo uso: espera a que Kafka este sano, crea los
  # topicos y termina. Que aparezca como "exited (0)" es lo normal.
  kafka-init:
    image: apache/kafka:3.8.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["bash", "/crear-topicos.sh"]
    volumes:
      - ./kafka/crear-topicos.sh:/crear-topicos.sh:ro,z
    networks:
      - red_inscripciones

volumes:
  pgdata:

networks:
  red_inscripciones:
    driver: bridge
